name: daily-arena

# 主观题评分：容器里调不到宿主的 qodercli.exe，走宿主 CLI 桥（scripts/llm-bridge.mjs）。
# arena 与 dev 必须共用同一份 —— 漏一处就是"--dev 下主观题永远只能人工自检"。
x-llm-env: &llm-env
  ARENA_LLM_PROVIDERS: ${ARENA_LLM_PROVIDERS:-bridge,qodercli,copilot,manual}
  ARENA_LLM_BRIDGE_URL: ${ARENA_LLM_BRIDGE_URL:-http://host.docker.internal:7799}
  ARENA_LLM_BRIDGE_TOKEN: ${ARENA_LLM_BRIDGE_TOKEN:-}
x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

services:
  arena:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: daily-arena:0.1
    container_name: daily-arena
    ports:
      # 绑回环而不是 0.0.0.0：这台工具会把整个题库（含被"移除"的题）从 /api/bank 发出来，
      # 而它没有任何鉴权 —— 发布到所有网卡等于让同局域网的人浏览你的题库与进度。
      # "隐藏"的语义是从今日套餐/游戏里摘出去，不是保密；把暴露面收小比给它加一套登录更划算。
      # 代价说清楚：**手机 / iPad 访问不了**（已确认不需要，2026-09-24）。
      # 闸门：server/test/regression/compose-ports.test.ts 钉住"每个发布端口都必须绑回环"。
      - "127.0.0.1:7788:7788"
      # notebook 同样只绑回环：它等于"任意代码执行 + 能读题库文件"，开到局域网比 /api/bank 严重。
      # 代价一样：手机 / iPad 打不开（已确认不需要）。闸门：notebook-compose.test.ts
      - "127.0.0.1:7789:8888"
    volumes:
      # 运行期数据与依赖缓存都留在仓库目录内（需求 通用 7 / 场景 14）
      - ./data:/app/data
      - ./docker-cache:/root/.cache
      # 题库是文件形态：挂载后改题目不必重新构建镜像
      - ./content:/app/content
      # IDE 的用户依赖环境**必须走命名卷，不能放 ./data**：那是 Windows 的 bind mount，
      # 实测 `python3 -m venv` 在 /opt 1.76s、在 /app/data 87.2s（慢 50 倍，直接撞穿创建超时）。
      # 卷还能跨 rebuild 保留 —— 用户装的包不该因为改一行 Dockerfile 就没了。
      - arena-ide-env:/opt/arena-ide-env
    environment:
      NODE_ENV: production
      ARENA_IDE_ENV_DIR: /opt/arena-ide-env
      ARENA_DB_FILE: /app/data/arena.db
      ARENA_BANK_DIR: /app/content/questions
      ARENA_PORT: "7788"
      # notebook 的 token 只做透传、不给默认值：唯一来源是 .env（./start.sh 首启生成）。
      # 缺了就该由 entrypoint 决定"不起"（见 docker/entrypoint.sh），而不是悄悄起一个无鉴权的。
      # **谁拿到这一行，就等于谁起一个 jupyter**（entrypoint 是镜像级的）：所以只有 arena 与 tools
      # 拿到它，dev / e2e 故意不给（各自的块里写了原因）。这条"该给的必须给、不该给的必须不给"
      # 由 notebook-compose.test.ts 的 ⑤⑥ 钉住，不靠人记 —— 漏一面都是静默的。
      # 闸门：server/test/regression/notebook-compose.test.ts
      ARENA_JUPYTER_TOKEN: ${ARENA_JUPYTER_TOKEN:-}
      # 容器标记：`server/test/notebooks/kernel.test.ts` 那一组（真跑 notebook、读运行中的
      # jupyter 进程的 PATH、查 token 键与 /proc/net/route）只有在容器里才成立，门控写在文件里
      # （describe.skipIf），宿主档就不会被它们撞红。宿主**永不设**这个变量（哪台设了哪台没设，
      # 由那条常驻解释断言与 verify.sh 的阶段一起判）。容器档验证走 `./start.sh --verify`，
      # 它 exec 进的是这个 arena 服务 —— 那一组真正要验的就是这里。
      ARENA_IN_CONTAINER: "1"
      # 服务身份标记（评审 I-2）：上面那条只说"这是容器"，而 arena / dev / tools 三台都是；
      # 容器那一组的**前置条件**（跑着的 jupyter、透传进来的 token、镜像级 kernel 文件）却只有 arena 满足：
      #   · tools 覆盖了 entrypoint ⇒ 没有跑着的 jupyter，而且它连 ARENA_IDE_ENV_DIR 都没有
      #     （那三处 = arena / dev / e2e，由 notebook-image.test.ts 钉住）⇒ config.ideEnvDir 退回
      #     dataDir/ide-env = Windows 的 bind mount（本文件上面那条 IDE 卷注释记的 87.2s vs 1.76s），
      #     那一组会先在那里试建 venv 把 200s 预算吃掉，再红一句"venv 创建失败"；
      #   · dev 有卷、也是 arena 那个镜像（kernel 文件在），但它按设计拿不到 token（见下面 ⑥ 那段）
      #     ⇒ entrypoint 的守卫让它根本没有 jupyter ⇒ PATH / token 键 / 路由表那三条会红在"错服务"上。
      # 两种红都错认了对象。所以 kernel.test.ts 的门控读的是**合取**（容器标记 && 服务标记），
      # 这一行只给 arena。谁给第二行由 notebook-compose.test.ts ⑦ 判。
      # ⚠ 别改用"`/proc` 里有没有 `--ServerApp.root_dir=` 进程"来分辨：那正是那一组要找的东西，
      #   拿它当门控 = 断言自我循环（那条判据自己就红了不算，它还永远不会红）。
      ARENA_NOTEBOOK_SERVICE: "1"
      <<: *llm-env
    extra_hosts: *host-gateway
    init: true
    command: ["node", "server/dist/index.js"]

  # 开发/验证工具位：复用同一镜像的 linux 依赖层，把源码挂载进去跑测试与构建
  tools:
    image: arena-deps:dev
    container_name: daily-arena-tools
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
      - ./web:/app/web
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./content:/app/content
      - ./data:/app/data
      - ./package.json:/app/package.json
      - ./eslint.config.mjs:/app/eslint.config.mjs
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - ./vitest.config.ts:/app/vitest.config.ts
      - ./docker:/app/docker
      - ./docker-cache/npm:/root/.npm
    environment:
      # tools 覆盖了 entrypoint（下面那条 `entrypoint: ["bash","-lc"]`），自己不会起 jupyter。
      # token 照透传（Task 4 起就是这一行，且 notebook-compose.test.ts ⑤ 钉着"arena 与 tools 必须给同一份"）：
      # 它现在的价值是"同一个人、同一台机器上只有一个 notebook token"，在这里跑的服务端代码读的
      # 也是同一个值。**注意**：Task 10 的容器档 kernel 那一组**不再**在这个容器里跑（评审 I-2 ——
      # tools 没有 ARENA_IDE_ENV_DIR，那一组读的是合取门控，在这里干净跳过），所以别再拿"kernel 测试
      # 要在 tools 里读 token"给这一行当理由。只透传，不加端口。
      ARENA_JUPYTER_TOKEN: ${ARENA_JUPYTER_TOKEN:-}
      # 容器标记见 arena 块那段注释。tools 里 entrypoint 被覆盖 ⇒ **没有**跑着的 jupyter，
      # 且它没有 ARENA_IDE_ENV_DIR ⇒ IDE 环境会退回 bind mount 上那份 data/ide-env（87s 那条）。
      # 所以这里只给容器标记、**不给** ARENA_NOTEBOOK_SERVICE：kernel.test.ts 那一组读的是合取，
      # 在这个容器里干净跳过（报告写出 "N skipped"），不会去 data/ 上试建 venv 再报一条错认了对象的
      # "venv 创建失败"（评审 I-2）。容器档的正解仍是 `./start.sh --verify`（exec 进 arena）。
      ARENA_IN_CONTAINER: "1"
    init: true
    entrypoint: ["bash", "-lc"]
    command: ["echo '用 docker compose run --rm tools <命令>'"]

  # 同一个镜像的开发模式（vite dev server + 后端 watch），不是第二个镜像
  dev:
    image: daily-arena:0.1
    container_name: daily-arena-dev
    profiles: ["dev"]
    ports:
      # 同 arena：开发模式也别把端口开到局域网（vite 的 5173 代理着同一个 /api）
      - "127.0.0.1:7788:7788"
      - "127.0.0.1:5173:5173"
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./docker-cache:/root/.cache
      # 与 arena 同一个卷：dev 与正式跑的是同一个人在同一台机器上的环境，分开只会让人困惑
      - arena-ide-env:/opt/arena-ide-env
    environment:
      NODE_ENV: development
      ARENA_IDE_ENV_DIR: /opt/arena-ide-env
      ARENA_DB_FILE: /app/data/arena.db
      ARENA_BANK_DIR: /app/content/questions
      ARENA_PORT: "7788"
      # dev **故意不透传** ARENA_JUPYTER_TOKEN：entrypoint 的守卫（缺 token 就不起）因此让 dev
      # 里根本没有 jupyter。理由不是"省内存"，是隔离 —— dev 挂的是 `./:/app` 与 `./data`（读写），
      # 而它又没有 notebook 端口，起一个 server 等于"多一个能读写真人笔记的进程、且没人能从外面
      # 访问它"，纯增加面。要 dev 也能用 notebook，得先给它自己的端口与自己的数据目录，
      # 那时这条判据（notebook-compose.test.ts ⑥）要跟着改并写下理由。
      # 容器标记照给（见 arena 块那段注释）：dev 用的就是 arena 那个镜像 ⇒ kernel 文件**在**，
      # 但它没有 token ⇒ entrypoint 不起 jupyter。`ARENA_NOTEBOOK_SERVICE` 故意不给：那一组读的是
      # 合取（容器标记 && 服务标记），在 dev 里干净跳过并报告写出 "N skipped"（评审 I-2）——
      # 容器档的正解是 --verify（arena），在这里承诺"会在跑"只会多一条错认对象的红。
      ARENA_IN_CONTAINER: "1"
      <<: *llm-env
    extra_hosts: *host-gateway
    init: true
    command: ["npm", "run", "dev"]

  # E2E 专用实例（WI-40）：同一个镜像，但**可写状态**全在 data/e2e 下 ——
  # 数据目录（db/日志/判题沙箱）与软删账本都另起一份，题库还是只读挂进来，
  # 所以跑 E2E 不会改动真人的 XP/连击，也不可能把题目从 content/hidden.json 里抹掉。
  # 用 `npm run e2e`（tests/e2e/instance.setup.ts 负责起停），不是 compose up 的默认成员。
  e2e:
    image: daily-arena:0.1
    container_name: daily-arena-e2e
    profiles: ["e2e"]
    ports:
      # 7799 是宿主 CLI 桥的端口，别再占它（撞上去会让两个实例的 llm-rubric 一起变 false）
      - "127.0.0.1:7798:7788"
    volumes:
      - ./data:/app/data
      - ./docker-cache:/root/.cache
      - ./content:/app/content:ro
      # E2E 用**自己那份**卷：真人装在 IDE 里的包不许影响测试结果，反之亦然
      # （与 ARENA_DATA_DIR 指向 data/e2e 是同一条隔离纪律）。
      - arena-ide-env-e2e:/opt/arena-ide-env
    environment:
      NODE_ENV: production
      ARENA_IDE_ENV_DIR: /opt/arena-ide-env
      ARENA_DATA_DIR: /app/data/e2e
      # 三条都显式给：镜像里的旧 config 不会从 ARENA_DATA_DIR 派生 db/沙箱路径，
      # 少一条就会静默写回真人那份 data/arena.db（实测踩过）。
      ARENA_DB_FILE: /app/data/e2e/arena.db
      ARENA_HIDDEN_FILE: /app/data/e2e/hidden.json
      ARENA_BANK_DIR: /app/content/questions
      ARENA_PORT: "7788"
      # e2e **故意不透传** ARENA_JUPYTER_TOKEN ⇒ entrypoint 的"缺 token 就不起"守卫让这个实例
      # 里没有 jupyter。这是 WI-40 那条隔离纪律的一部分，不是漏接线：e2e 挂的是 `./data`（读写），
      # 给它 token 就等于给隔离实例开一条通往真人笔记的读写路径，而现有那条隔离判据只 hash
      # data/arena.db-wal，看不见 notebooks —— 它不会替我们红。等 Task 8 的服务端代理落地，
      # 这条路径会从"今天没有端口暴露"变成"真的打得开"，所以现在就把它堵在 token 上。
      # 判据：notebook-compose.test.ts ⑥（e2e/dev 必须拿不到）与 ③（e2e 不许出现 notebook 端口）。
      <<: *llm-env
    extra_hosts: *host-gateway
    init: true
    command: ["node", "server/dist/index.js"]

# IDE 的用户依赖环境。命名卷活在 Docker VM 的 ext4 里，所以既没有 bind mount 的 50 倍惩罚，
# 也不会因为 ./start.sh --rebuild 就丢掉用户装的包。
# 闸门：server/test/ide/env.test.ts 会读 compose 确认 arena 把 ARENA_IDE_ENV_DIR 指在 bind mount 之外。
volumes:
  arena-ide-env:
  arena-ide-env-e2e:
